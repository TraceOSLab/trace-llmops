services:
  postgres:
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"

  weaviate:
    restart: unless-stopped
    ports:
      - "${WEAVIATE_PORT:-8080}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
