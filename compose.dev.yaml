services:
  postgres:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME:-youyou-llmops}-postgres
    environment:
      POSTGRES_DB: llmops
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d llmops']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-youyou-llmops}-redis
    command:
      - redis-server
      - --appendonly
      - 'yes'
    ports:
      - '6379:6379'
    volumes:
      - ./docker/data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.34.4
    container_name: ${PROJECT_NAME:-youyou-llmops}-weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    ports:
      - '8080:8080'
      - '50051:50051'
    volumes:
      - ./docker/data/weaviate:/var/lib/weaviate
