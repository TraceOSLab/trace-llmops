model: kimi-k3
label: Kimi K3
model_type: chat
features:
  - tool_call
  - agent_thought
  - image_input
context_window: 1048576
max_output_tokens: 1048576
attributes:
  model: kimi-k3
parameters:
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: temperature
    use_template: temperature
    min: 1
    max: 1
    default: 1
  - name: top_p
    use_template: top_p
    min: 0.95
    max: 0.95
    default: 0.95
  - name: max_tokens
    use_template: max_completion_tokens
    default: 8192
    max: 1048576
