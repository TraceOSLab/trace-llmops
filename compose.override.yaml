services:
  postgres:
    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    volumes:
      - ./docker/data/postgres:/var/lib/postgresql/data

  redis:
    ports:
      - '${REDIS_PORT:-6379}:6379'

    volumes:
      - ./docker/data/redis:/data

  weaviate:
    ports:
      - '${WEAVIATE_PORT:-8080}:8080'
      - '${WEAVIATE_GRPC_PORT:-50051}:50051'

    volumes:
      - ./docker/data/weaviate:/var/lib/weaviate
