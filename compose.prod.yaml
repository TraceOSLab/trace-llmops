services:
  postgres:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ${DOCKER_DATA_DIR:?Set DOCKER_DATA_DIR to an absolute persistent data directory}/postgres
        target: /var/lib/postgresql/data

  redis:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - type: bind
        source: ${DOCKER_DATA_DIR:?Set DOCKER_DATA_DIR to an absolute persistent data directory}/redis
        target: /data

  weaviate:
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEAVIATE_PORT:-8080}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT:-50051}:50051"
    volumes:
      - type: bind
        source: ${DOCKER_DATA_DIR:?Set DOCKER_DATA_DIR to an absolute persistent data directory}/weaviate
        target: /var/lib/weaviate
