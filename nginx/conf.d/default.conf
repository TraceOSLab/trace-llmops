upstream llmops_web {
    zone llmops_web 64k;
    server llmops-web:3000 resolve;
}

upstream llmops_api {
    zone llmops_api 64k;
    server llmops-api:5001 resolve;
}

server {
    listen 80;
    server_name llmops.qiuyouyou.cn;

    # Preserve the request method, path and query when switching to HTTPS.
    return 308 https://llmops.qiuyouyou.cn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name llmops.qiuyouyou.cn;

    ssl_certificate /etc/nginx/ssl/llmops.qiuyouyou.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/llmops.qiuyouyou.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Backend accepts files up to 15 MiB; allow multipart overhead.
    client_max_body_size 20m;

    location = /api {
        return 308 /api/$is_args$args;
    }

    location ^~ /api/ {
        include /etc/nginx/proxy.conf;
        # The trailing slash removes /api/ before forwarding to Flask.
        proxy_pass http://llmops_api/;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location / {
        include /etc/nginx/proxy.conf;
        proxy_pass http://llmops_web;
    }
}
