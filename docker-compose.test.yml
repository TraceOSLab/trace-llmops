services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: llmops_test
      POSTGRES_USER: llmops_test
      POSTGRES_PASSWORD: llmops_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./llmops-api/test/integration/postgres-init.sql:/docker-entrypoint-initdb.d/001-test-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmops_test -d llmops_test"]
      interval: 1s
      timeout: 3s
      retries: 30
